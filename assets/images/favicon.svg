<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#090d16" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGrad)" />
  
  <!-- Subtle top-down highlight border for depth -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#innerGlow)" stroke-width="1.5" />

  <!-- Monogram <S/> -->
  <!-- Left Bracket < -->
  <path d="M 18 23 L 11 32 L 18 41" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />

  <!-- Bold Letter S -->
  <path d="M 33 26 C 33 23.5 30.5 22 27.5 22 C 24 22 22 24 22 27 C 22 31 33 32 33 36.5 C 33 39.5 30.5 42 27.5 42 C 24 42 22 40 22 37.5" 
        fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />

  <!-- Accent Slash / -->
  <line x1="37.5" y1="41.5" x2="42.5" y2="22.5" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" filter="url(#shadow)" />

  <!-- Right Bracket > -->
  <path d="M 46 23 L 53 32 L 46 41" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
</svg>
